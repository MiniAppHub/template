# Workflow мини-приложения. Кладётся платформой, ручная правка не сохраняется:
# при следующем приёме PR файл заменяется на этот.
#
# Что делает при пуше в main:
#   1) читает mapp/mapp.manifest.json и версию из него;
#   2) собирает сайт из mapp/<routers.web | public> в ветку gh-pages;
#   3) обновляет плавающий релиз latest в этом репозитории (архив);
#   4) при смене мажорной версии создаёт релиз vX.0.0;
#   5) отправляет в портал упрощённый манифест: версии latest и major со ссылками.
name: app-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PORTAL_REPO: MiniAppHub/miniapphub.github.io
      PORTAL_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Прочитать манифест
        id: man
        run: |
          set -eu
          M=mapp/mapp.manifest.json
          test -f "$M" || { echo "::error::нет $M"; exit 1; }
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('$M', 'utf8'));
            for (const k of ['id','name','version','author']) if (!m[k]) throw new Error('в манифесте нет ' + k);
            if (!/^[a-z0-9-]+\.[a-z0-9-]+$/i.test(m.id)) throw new Error('id должен быть author.app-name');
            if (!m.id.toLowerCase().startsWith(m.author.toLowerCase() + '.')) throw new Error('префикс id не совпадает с author');
            if (!/^\d+\.\d+\.\d+$/.test(m.version)) throw new Error('version должен быть X.Y.Z');
            const web = String((m.routers && m.routers.web) || 'public').replace(/^\.?\//,'').replace(/\/+\$/,'');
            const dir = 'mapp/' + web;
            if (!fs.existsSync(dir + '/index.html')) throw new Error('нет ' + dir + '/index.html');
            const out = { id: m.id, name: m.name, version: m.version, author: m.author,
              description: m.description || '', icon: m.icon || null,
              permissions: Array.isArray(m.permissions) ? m.permissions : [], dir };
            fs.writeFileSync('/tmp/man.json', JSON.stringify(out));
            for (const [k,v] of Object.entries({id:out.id,name:out.name,version:out.version,author:out.author,dir:out.dir}))
              fs.appendFileSync(process.env.GITHUB_OUTPUT, k + '=' + v + '\n');
            console.log('манифест:', out.id, out.version, '→', out.dir);
          "

      - name: Собрать сайт в gh-pages
        run: |
          set -eu
          DIR="${{ steps.man.outputs.dir }}"
          mkdir -p /tmp/site
          cp -r "$DIR"/. /tmp/site/
          touch /tmp/site/.nojekyll
          # манифест публикуется рядом: по нему мини-приложение проверяет обновления
          cp mapp/mapp.manifest.json /tmp/site/mapp.manifest.json
          cd /tmp/site
          git init -q -b gh-pages
          git config user.name "MiniAppHub"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -qm "gh-pages: ${{ steps.man.outputs.version }}"
          git push -f "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages

      - name: Упаковать архив
        run: |
          set -eu
          DIR="${{ steps.man.outputs.dir }}"
          cd "$DIR" && zip -qr "$GITHUB_WORKSPACE/MiniAppHub-app-${{ steps.man.outputs.version }}.zip" . && cd -
          ls -la MiniAppHub-app-*.zip

      - name: Классификация версии
        id: cls
        run: |
          set -eu
          NEW="${{ steps.man.outputs.version }}"
          PREV=$(gh release view latest --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | sed -n 's/^version: *//p' | head -1 || true)
          echo "опубликовано: ${PREV:-нет}, собираем: $NEW"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV" ]; then
            echo "action=release" >> "$GITHUB_OUTPUT"; echo "is_major=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$NEW" = "$PREV" ]; then
            echo "версия не изменилась — релизы не трогаем"
            echo "action=skip" >> "$GITHUB_OUTPUT"
            echo "is_major=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$PREV" "$NEW" | sort -V | tail -1)" != "$NEW" ]; then
            echo "::error::версия $NEW ниже опубликованной $PREV"; exit 1
          fi
          echo "action=release" >> "$GITHUB_OUTPUT"
          if [ "${NEW%%.*}" != "${PREV%%.*}" ]; then echo "is_major=true" >> "$GITHUB_OUTPUT"; else echo "is_major=false" >> "$GITHUB_OUTPUT"; fi

      - name: Обновить latest
        if: steps.cls.outputs.action == 'release'
        run: |
          set -eu
          V="${{ steps.man.outputs.version }}"
          ZIP="MiniAppHub-app-$V.zip"
          if ! gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "latest" --notes "version: $V"
          fi
          for n in $(gh release view latest --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            gh release delete-asset latest "$n" --repo "$GITHUB_REPOSITORY" --yes
          done
          gh release upload latest "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit latest --repo "$GITHUB_REPOSITORY" --title "latest" --notes "$(printf 'version: %s\n\nТекущая версия мини-приложения.' "$V")"

      - name: Релиз мажорной версии
        if: steps.cls.outputs.action == 'release' && steps.cls.outputs.is_major == 'true'
        run: |
          set -eu
          V="${{ steps.man.outputs.version }}"
          MAJOR="${V%%.*}"
          if [ "$MAJOR" = "0" ]; then echo "мажор 0 — релиз не создаём"; exit 0; fi
          TAG="v$MAJOR.0.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "релиз $TAG уже есть"; exit 0; fi
          gh release create "$TAG" "MiniAppHub-app-$V.zip" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes "Мажорный релиз линии $MAJOR.x"

      - name: Отправить в портал
        if: steps.cls.outputs.action == 'release'
        env:
          V: ${{ steps.man.outputs.version }}
          MAJOR_NUM: ${{ steps.cls.outputs.is_major }}
        run: |
          set -eu
          V="${{ steps.man.outputs.version }}"
          MAJOR="${V%%.*}"
          OWNER_LC=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          NAME="${GITHUB_REPOSITORY#*/}"
          WEB="https://${OWNER_LC}.github.io/${NAME}/"
          LATEST_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/latest/MiniAppHub-app-$V.zip"
          MAJOR_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$MAJOR.0.0/MiniAppHub-app-$V.zip"

          export WEB LATEST_URL MAJOR_URL MAJOR="$MAJOR"
          export V
          PAYLOAD=$(node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("/tmp/man.json", "utf8"));
            const e = process.env;
            process.stdout.write(JSON.stringify({
              id: m.id,
              name: m.name,
              author: m.author,
              description: m.description,
              permissions: m.permissions,
              web: e.WEB,
              manifest: e.WEB + "mapp.manifest.json",
              icon: e.WEB + "assets/icon.svg",
              repo: "https://github.com/" + e.GITHUB_REPOSITORY,
              version: {
                latest: { v: e.V, url: e.LATEST_URL },
                major: { v: e.MAJOR, url: e.MAJOR_URL }
              }
            }));
          ')

          echo "$PAYLOAD"
          curl -sS -X POST \
            -H "Authorization: Bearer $PORTAL_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$PORTAL_REPO/dispatches" \
            -d "{\"event_type\":\"app-release\",\"client_payload\":$PAYLOAD}"
