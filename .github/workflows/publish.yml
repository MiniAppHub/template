# Публикация приложения: по тегу v* собирается ZIP и создаётся GitHub Release.
name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Проверка манифеста
        run: npm run check
      - name: Проверка тега против версии манифеста
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./mapp/mapp.manifest.json').version")
          [ "$TAG" = "$VER" ] || { echo "тег v$TAG не совпадает с версией манифеста $VER"; exit 1; }
      - name: Упаковка
        run: sudo apt-get install -y -q zip >/dev/null && node scripts/pack.mjs
      - name: Релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/app.json
          generate_release_notes: true
